    // ==========================================
    // HARMFUL ADDITIVES DETECTOR
    // ==========================================
    const HARMFUL_DATABASE = [
      { regex: /129|allura red|red 40|colour \(129\)/i, name: "Food Colour 129 (Allura Red AC / Red 40)", category: "Petroleum Azo Dye", severity: "Severe", risk: "Petroleum-derived synthetic dye. Clinically linked to ADHD/hyperactivity in children, gut barrier inflammation, and hives." },
      { regex: /102|tartrazine|yellow 5|colour \(102\)/i, name: "Tartrazine (Colour 102 / Yellow 5)", category: "Synthetic Azo Dye", severity: "Severe", risk: "Known allergen and neuro-irritant. Can trigger asthma attacks, hives, and extreme behavioral swings in children." },
      { regex: /150d|caramel iv|caramel color/i, name: "Caramel IV (Colour 150d / Ammonia-Sulphite)", category: "Industrial Chemical Colour", severity: "High", risk: "Synthesized using ammonia compounds. Contains trace 4-MEI (4-Methylimidazole), flagged as a potential carcinogen." },
      { regex: /338|phosphoric acid/i, name: "Phosphoric Acid (INS 338)", category: "Acidifier & Enamel Stripper", severity: "High", risk: "Aggressively leaches calcium from dental enamel and bone tissue. Strongly associated with lower bone mineral density." },
      { regex: /palm oil|palmolein|palm fat|fractionated palm/i, name: "Palm Oil / Palmolein", category: "Atherogenic Saturated Fat", severity: "High", risk: "Contains ~50% palmitic saturated acid. Elevates LDL (bad) cholesterol and accelerates arterial plaque buildup." },
      { regex: /211|sodium benzoate/i, name: "Sodium Benzoate (Preservative 211)", category: "Chemical Preservative", severity: "High", risk: "When exposed to Vitamin C or heat, can synthesize into Benzene—a classified group-1 human carcinogen." },
      { regex: /452\(?i\)?|sequesterant|polyphosphate|edta|385/i, name: "Sequesterants & Polyphosphates (452i, 385)", category: "Chemical Chelator", severity: "High", risk: "Disrupts natural phosphate balance, leaches calcium from bones, and strains kidney filtration." },
      { regex: /621|monosodium glutamate|msg|flavour enhancer \(621\)/i, name: "Monosodium Glutamate (MSG / INS 621)", category: "Excitotoxin / Appetite Stimulant", severity: "Moderate", risk: "Overstimulates neurological glutamate receptors; triggers cravings, overeating, and headaches." },
      { regex: /aspartame|951|sucralose|955|acesulfame|950/i, name: "Artificial Chemical Sweeteners (Aspartame / Sucralose / Ace-K)", category: "Synthetic Sweetener", severity: "Moderate", risk: "Disrupts healthy gut microbiome bacteria and drives compensatory carbohydrate cravings." },
      { regex: /maida|refined wheat flour/i, name: "Refined Wheat Flour (Maida)", category: "Stripped Empty Starch", severity: "Moderate", risk: "Fiber and germ stripped away. Extreme glycemic index triggers rapid blood sugar surges and metabolic fatigue." }
    ];

    function detectHarmfulIngredients(ingredientsText = "", nutriments = {}) {
      const detected = [];
      const text = ingredientsText || "";
      HARMFUL_DATABASE.forEach(item => {
        if (item.regex.test(text)) detected.push(item);
      });
      const sugar100 = nutriments["sugars_100g"] == null ? null : Number(nutriments["sugars_100g"]);
      if (sugar100 !== null && sugar100 >= 25) {
        detected.push({ name: `Excessive Refined Sugar (${sugar100}g / 100g)`, category: "Metabolic Risk", severity: "Severe", risk: "Contains over 25% pure sugar by weight. Drives insulin resistance and visceral liver fat." });
      }
      const salt100 = nutriments["salt_100g"] == null ? null : Number(nutriments["salt_100g"]);
      if (salt100 !== null && salt100 >= 1.8) {
        detected.push({ name: `Heavy Sodium / Salt Load (${salt100}g / 100g)`, category: "Cardiovascular Risk", severity: "High", risk: "Exceeds daily safe sodium limits in a single serving. Elevates chronic hypertension risk." });
      }
      return detected;
    }

    // ==========================================
    // 0 - 100 HEALTH SCORE ENGINE
    // ==========================================
    function calculateHealthScore(product) {
      const n = product.nutriments || {};
      // Do not award a confident score when essential nutrition data is absent.
      const knownCore = ["sugars_100g", "saturated-fat_100g", "salt_100g", "energy-kcal_100g"]
        .filter(key => n[key] !== null && n[key] !== undefined && Number.isFinite(Number(n[key]))).length;
      let score = 55;

      const sugars = n["sugars_100g"] == null ? null : Number(n["sugars_100g"]);
      if (sugars !== null) {
        if (sugars > 30) score -= 25;
        else if (sugars > 20) score -= 18;
        else if (sugars > 10) score -= 12;
        else if (sugars <= 3) score += 4;
      }

      const satFat = n["saturated-fat_100g"] == null ? null : Number(n["saturated-fat_100g"]);
      if (satFat !== null) {
        if (satFat > 10) score -= 15;
        else if (satFat > 5) score -= 9;
        else if (satFat <= 1.5) score += 3;
      }

      const saltRaw = n["salt_100g"] ?? (n["sodium_100g"] != null ? Number(n["sodium_100g"]) * 2.5 : null);
      const salt = saltRaw == null ? null : Number(saltRaw);
      if (salt !== null) {
        if (salt > 1.8) score -= 15;
        else if (salt > 1.0) score -= 9;
        else if (salt <= 0.3) score += 3;
      }

      const kcal = n["energy-kcal_100g"] == null ? null : Number(n["energy-kcal_100g"]);
      if (kcal !== null) {
        if (kcal > 500) score -= 8;
        else if (kcal > 380) score -= 4;
      }

      const fiber = n["fiber_100g"] == null ? null : Number(n["fiber_100g"]);
      if (fiber !== null && fiber >= 5) score += 5;
      const protein = n["proteins_100g"] == null ? null : Number(n["proteins_100g"]);
      if (protein !== null && protein >= 10) score += 5;

      const harmful = detectHarmfulIngredients(product.ingredients_text, n);
      score -= (harmful.length * 4);
      if (product.has_palm_oil) score -= 5;

      // If most core values are missing, cap the result and label it as low-confidence.
      if (knownCore < 2) score = Math.min(score, 55);
      return Math.max(4, Math.min(95, Math.round(score)));
    }

    function getScoreBadge(score) {
      if (score >= 75) return { text: "Nutritious & Clean", bg: "bg-emerald-500", textCol: "text-emerald-700", lightBg: "bg-emerald-50", borderCol: "border-emerald-200" };
      if (score >= 50) return { text: "Moderate / Processed", bg: "bg-amber-500", textCol: "text-amber-700", lightBg: "bg-amber-50", borderCol: "border-amber-200" };
      if (score >= 30) return { text: "Poor / High Caution", bg: "bg-orange-500", textCol: "text-orange-700", lightBg: "bg-orange-50", borderCol: "border-orange-200" };
      return { text: "High Health Risk", bg: "bg-red-600", textCol: "text-red-700", lightBg: "bg-red-50", borderCol: "border-red-200" };
    }

    function HighlightedIngredientsText({ text }) {
      if (!text) return <span className="text-slate-400 italic">No ingredient statement available.</span>;
      const masterRegex = /(129|allura red|red 40|102|tartrazine|yellow 5|150d|caramel iv|caramel colour|338|phosphoric acid|palm oil|palmolein|sodium benzoate|211|potassium sorbate|202|452\(?i\)?|sequesterant|polyphosphate|edta|385|monosodium glutamate|msg|621|aspartame|951|sucralose|955|acesulfame|950|maida|refined wheat flour|taurine|caffeine)/gi;
      const parts = text.split(masterRegex);

      return (
        <span className="leading-relaxed">
          {parts.map((part, index) => {
            if (!part) return null;
            if (masterRegex.test(part)) {
              return <mark key={index} className="danger-highlight text-[11px]">⚠️ {part}</mark>;
            }
            return <span key={index}>{part}</span>;
          })}
        </span>
      );
    }

    // ==========================================
    // SVG ICONS
    // ==========================================
    const IconSearch = () => <svg className="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>;
    const IconScan = ({ className = "w-6 h-6" }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 9h10M7 12h10M7 15h6" /></svg>;
    const IconHeart = ({ filled = false }) => <svg className={`w-5 h-5 ${filled ? 'text-rose-500 fill-rose-500' : 'text-slate-400 stroke-current fill-none'}`} viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>;
    const IconHome = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>;
    const IconCompare = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>;

    // Shared Open Food Facts image fallback, available to all views.
    const offImageFromCode = (rawCode) => {
      const code = String(rawCode || "").replace(/\D/g, "");
      if (!code || code.length < 8) return "";
      const padded = code.padStart(13, "0");
      const path = `${padded.slice(0,3)}/${padded.slice(3,6)}/${padded.slice(6,9)}/${padded.slice(9)}`;
      return `https://images.openfoodfacts.org/images/products/${path}/front_en.400.jpg`;
    };

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [activeTab, setActiveTab] = useState("home");
      const [searchQuery, setSearchQuery] = useState("");
      const [searchResults, setSearchResults] = useState([]);
      const [isSearching, setIsSearching] = useState(false);
      const [searchError, setSearchError] = useState(null);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [usdaKeyReady, setUsdaKeyReady] = useState(() => { try { return !!localStorage.getItem("nutriscan_usda_api_key"); } catch { return false; } });

      const connectUSDA = () => {
        const key = window.prompt("Optional: paste your free USDA FoodData Central API key. Leave blank or cancel to skip. The key is stored only in this browser's localStorage.");
        if (key && key.trim()) {
          try { localStorage.setItem("nutriscan_usda_api_key", key.trim()); setUsdaKeyReady(true); alert("USDA database enabled in this browser."); }
          catch { alert("Could not save the key in this browser. You can still use Open Food Facts search."); }
        }
      };

      const [compareItemA, setCompareItemA] = useState(null);
      const [compareItemB, setCompareItemB] = useState(null);
      const [portionMode, setPortionMode] = useState("100g");

      const [favourites, setFavourites] = useState(() => {
        try {
          const s = localStorage.getItem("nutriscan_favs");
          return s ? JSON.parse(s) : [];
        } catch { return []; }
      });

      const [recentScans, setRecentScans] = useState(() => {
        try {
          const s = localStorage.getItem("nutriscan_recents");
          return s ? JSON.parse(s) : [MASTER_FOOD_DB[0], MASTER_FOOD_DB[2], MASTER_FOOD_DB[4]];
        } catch { return [MASTER_FOOD_DB[0], MASTER_FOOD_DB[2], MASTER_FOOD_DB[4]]; }
      });

      useEffect(() => {
        try { localStorage.setItem("nutriscan_favs", JSON.stringify(favourites)); } catch(e) {}
      }, [favourites]);

      useEffect(() => {
        try { localStorage.setItem("nutriscan_recents", JSON.stringify(recentScans)); } catch(e) {}
      }, [recentScans]);

      const toggleFavourite = (product) => {
        setFavourites(prev => {
          const exists = prev.some(p => (p.id || p.code) === (product.id || product.code));
          return exists ? prev.filter(p => (p.id || p.code) !== (product.id || product.code)) : [product, ...prev];
        });
      };

      const isFav = (product) => favourites.some(p => (p.id || p.code) === (product.id || product.code));

      const handleSelectProduct = (product) => {
        setSelectedProduct(product);
        setPortionMode("100g");
        setRecentScans(prev => {
          const filtered = prev.filter(p => (p.id || p.code) !== (product.id || product.code));
          return [product, ...filtered].slice(0, 10);
        });
      };

      // API helpers: use the documented Open Food Facts v2 endpoints.
      const fetchWithTimeout = async (url, timeoutMs = 10000) => {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          return await fetch(url, {
            signal: controller.signal,
            headers: { "Accept": "application/json" }
          });
        } finally {
          clearTimeout(timer);
        }
      };

      const offImageFromCode = (rawCode) => {
        const code = String(rawCode || "").replace(/\D/g, "");
        if (!code || code.length < 8) return "";
        const padded = code.padStart(13, "0");
        const path = `${padded.slice(0,3)}/${padded.slice(3,6)}/${padded.slice(6,9)}/${padded.slice(9)}`;
        return `https://images.openfoodfacts.org/images/products/${path}/front_en.400.jpg`;
      };

      const normalizeOffProduct = (p) => {
        const n = p?.nutriments || {};
        const code = String(p?.code || p?.id || "");
        const selectedFront = p?.selected_images?.front?.display?.en || p?.selected_images?.front?.small?.en || "";
        const image = p?.image_front_url || p?.image_front_small_url || p?.image_url || selectedFront || offImageFromCode(code);
        return {
          id: code || `${(p?.product_name || p?.product_name_en || "product").toLowerCase().replace(/[^a-z0-9]+/g, "-")}`,
          code,
          product_name: p?.product_name || p?.product_name_en || p?.generic_name || "Unnamed product",
          brands: p?.brands || "Brand not listed",
          image_url: image,
          serving_size: p?.serving_size || "100 g / 100 ml",
          nutriments: {
            "energy-kcal_100g": n["energy-kcal_100g"] ?? (typeof n["energy_100g"] === "number" ? n["energy_100g"] / 4.184 : null),
            "carbohydrates_100g": n["carbohydrates_100g"] ?? null,
            "sugars_100g": n["sugars_100g"] ?? null,
            "proteins_100g": n["proteins_100g"] ?? null,
            "fat_100g": n["fat_100g"] ?? null,
            "saturated-fat_100g": n["saturated-fat_100g"] ?? null,
            "salt_100g": n["salt_100g"] ?? (n["sodium_100g"] != null ? Number(n["sodium_100g"]) * 2.5 : null),
            "fiber_100g": n["fiber_100g"] ?? null
          },
          ingredients_text: p?.ingredients_text || p?.ingredients_text_en || "",
          has_palm_oil: Number(p?.ingredients_from_palm_oil_n || 0) > 0 || /palm\\s*(oil|olein|fat)/i.test(p?.ingredients_text || ""),
          nutriscore_grade: p?.nutriscore_grade || p?.nutriscore_grade_2023 || "unknown",
          category: (p?.categories || "").split(",")[0] || "Grocery",
          data_source: "Open Food Facts"
        };
      };

      const performSearch = async (term) => {
        const q = term.trim();
        if (!q) {
          setSearchResults([]);
          setSearchError(null);
          return;
        }

        setIsSearching(true);
        setSearchError(null);

        const qLower = q.toLowerCase();
        const localMatches = MASTER_FOOD_DB.filter(p =>
          p.product_name.toLowerCase().includes(qLower) ||
          p.brands.toLowerCase().includes(qLower) ||
          p.category.toLowerCase().includes(qLower) ||
          (p.tags && p.tags.some(t => t.toLowerCase().includes(qLower)))
        );

        // Show local results immediately while the live database is queried.
        setSearchResults(localMatches);

        try {
          const fields = [
            "code", "product_name", "product_name_en", "generic_name", "brands",
            "image_front_url", "image_front_small_url", "image_url", "selected_images", "serving_size",
            "nutriments", "ingredients_text", "ingredients_text_en",
            "ingredients_from_palm_oil_n", "nutriscore_grade", "nutriscore_grade_2023",
            "categories", "countries"
          ].join(",");
          // Important: v2 /search is primarily filter-based, not reliable full-text search.
          // Use Open Food Facts' full-text CGI search, then retry its .net mirror if needed.
          const endpoints = [
            `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=40&fields=${encodeURIComponent(fields)}`,
            `https://world.openfoodfacts.net/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=40&fields=${encodeURIComponent(fields)}`
          ];
          let data = null;
          let lastError = null;
          for (const url of endpoints) {
            try {
              const res = await fetchWithTimeout(url, 12000);
              if (!res.ok) throw new Error(`Product database returned HTTP ${res.status}`);
              const candidate = await res.json();
              if (Array.isArray(candidate.products)) { data = candidate; break; }
              throw new Error("The product database returned an unexpected response.");
            } catch (err) { lastError = err; }
          }
          // Do not stop here: if Open Food Facts is unavailable, an enabled USDA source
          // should still get a chance to answer the search.
          if (!data) data = { products: [] };
          const rawList = Array.isArray(data.products) ? data.products : [];
          const liveItems = rawList
            .filter(p => p && (p.product_name || p.product_name_en || p.generic_name))
            .map(normalizeOffProduct);

          // Optional second source: USDA FoodData Central (requires the user's own free API key).
          // Branded US foods and general food composition can supplement, but not replace, package labels.
          try {
            const usdaKey = localStorage.getItem("nutriscan_usda_api_key");
            if (usdaKey) {
              const u = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(usdaKey)}&query=${encodeURIComponent(q)}&pageSize=15`;
              const ur = await fetchWithTimeout(u, 10000);
              if (ur.ok) {
                const ud = await ur.json();
                for (const f of (ud.foods || [])) {
                  const nutrients = f.foodNutrients || [];
                  const findN = (...names) => { const hit = nutrients.find(x => names.some(n => (x.nutrientName || "").toLowerCase().includes(n))); return hit && Number.isFinite(Number(hit.value)) ? Number(hit.value) : null; };
                  const energy = findN("energy");
                  const carbs = findN("carbohydrate");
                  const sugars = findN("sugars, total");
                  const protein = findN("protein");
                  const fat = findN("total lipid");
                  const satFat = findN("fatty acids, total saturated");
                  const fiber = findN("fiber, total dietary");
                  liveItems.push({
                    id: `usda-${f.fdcId}`, code: String(f.gtinUpc || f.fdcId || ""),
                    product_name: f.description || "USDA food record", brands: f.brandName || f.brandOwner || "Brand not listed",
                    image_url: "", serving_size: f.servingSize ? `${f.servingSize} ${f.servingSizeUnit || "g"}` : "100 g",
                    nutriments: { "energy-kcal_100g": energy, "carbohydrates_100g": carbs, "sugars_100g": sugars, "proteins_100g": protein, "fat_100g": fat, "saturated-fat_100g": satFat, "salt_100g": null, "fiber_100g": fiber },
                    ingredients_text: f.ingredients || "", has_palm_oil: /palm\s*(oil|olein|fat)/i.test(f.ingredients || ""),
                    nutriscore_grade: "unknown", category: "USDA FoodData Central", data_source: "USDA FoodData Central (check package label)"
                  });
                }
              }
            }
          } catch (usdaError) { /* Keep Open Food Facts results if USDA is unavailable. */ }

          // Prefer live records over local demo records when names/barcodes overlap;
          // this avoids keeping stale demo photos when a real packshot is available.
          const combined = [...liveItems];
          for (const item of localMatches) {
            const duplicate = combined.some(c =>
              (item.code && c.code && String(c.code) === String(item.code)) ||
              c.product_name?.trim().toLowerCase() === item.product_name.trim().toLowerCase() ||
              (qLower.length >= 4 && c.brands && item.brands &&
                c.brands.toLowerCase().includes(qLower) && item.brands.toLowerCase().includes(qLower))
            );
            if (!duplicate) combined.push(item);
          }

          setSearchResults(combined);
          if (combined.length === 0) {
            setSearchError(`No matching products were found for "${q}". Try the brand name, a shorter product name, or the barcode. This product may not be listed in Open Food Facts yet.`);
          }
        } catch (err) {
          // Keep any local matches visible if the network/API is unavailable.
          if (localMatches.length === 0) {
            const message = err?.name === "AbortError"
              ? "The product database took too long to respond. Check your connection and try again."
              : "The live product database could not be reached. Check your connection and try again; local demo products may still be available.";
            setSearchError(message);
          } else {
            setSearchError("Showing saved demo matches. The live database could not be reached, so more results may be unavailable.");
          }
        } finally {
          setIsSearching(false);
        }
      };

      const searchByBarcode = async (barcode) => {
        const cleanBarcode = String(barcode || "").trim().replace(/\s+/g, "");
        if (!cleanBarcode) {
          setSearchError("Enter a barcode first.");
          return;
        }

        setIsSearching(true);
        setSearchError(null);
        try {
          const productFields = "code,product_name,product_name_en,generic_name,brands,image_front_url,image_front_small_url,image_url,selected_images,serving_size,nutriments,ingredients_text,ingredients_text_en,ingredients_from_palm_oil_n,nutriscore_grade,nutriscore_grade_2023,categories";
          let data = null;
          let lastError = null;
          for (const host of ["world.openfoodfacts.org", "world.openfoodfacts.net"]) {
            try {
              const res = await fetchWithTimeout(`https://${host}/api/v2/product/${encodeURIComponent(cleanBarcode)}.json?fields=${productFields}`, 10000);
              if (!res.ok) throw new Error(`Product database returned HTTP ${res.status}`);
              const candidate = await res.json();
              if (candidate.status === 1 && candidate.product) { data = candidate; break; }
              data = candidate;
            } catch (err) { lastError = err; }
          }
          if (!data && lastError) throw lastError;

          if (data.status === 1 && data.product) {
            handleSelectProduct(normalizeOffProduct(data.product));
          } else {
            const demo = MASTER_FOOD_DB.find(dp => String(dp.code) === cleanBarcode);
            if (demo) {
              handleSelectProduct(demo);
            } else {
              setSearchError(`Barcode ${cleanBarcode} was not found in Open Food Facts. This does not necessarily mean the product is invalid; it may not be listed yet. Search by name or enter the nutrition-label details manually.`);
            }
          }
        } catch (err) {
          const demo = MASTER_FOOD_DB.find(dp => String(dp.code) === cleanBarcode);
          if (demo) {
            handleSelectProduct(demo);
          } else {
            setSearchError(err?.name === "AbortError"
              ? "The barcode lookup timed out. Please try again or search by product name."
              : "The barcode database could not be reached. Check your internet connection and try again.");
          }
        } finally {
          setIsSearching(false);
        }
      };

      const startComparison = (prod) => {
        setCompareItemA(prod);
        setCompareItemB(MASTER_FOOD_DB[MASTER_FOOD_DB.length - 1]);
        setActiveTab("compare");
        setSelectedProduct(null);
      };

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col justify-between max-w-md mx-auto shadow-2xl relative border-x border-slate-200">
          
          {/* HEADER */}
          <header className="bg-white/95 backdrop-blur-md sticky top-0 z-30 px-5 pt-3.5 pb-3 border-b border-slate-100 flex items-center justify-between">
            <div className="flex items-center space-x-2.5">
              <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-white shadow-sm shadow-emerald-200">
                <IconScan className="w-4 h-4 text-white" />
              </div>
              <div>
                <div className="flex items-center space-x-1.5">
                  <span className="font-extrabold tracking-tight text-slate-900 text-lg">Qyvarnex</span>
                  <span className="bg-red-100 text-red-700 text-[9px] font-black px-1.5 py-0.5 rounded-full uppercase">Safety Intelligence</span>
                </div>
                <p className="text-[11px] text-slate-400 leading-none">Product lookup, nutrition labels & ingredients</p>
              </div>
            </div>

            <div className="flex items-center space-x-2">
              <button onClick={() => { setActiveTab("compare"); setSelectedProduct(null); }} className="p-2 text-slate-500 hover:text-brand-600 hover:bg-slate-100 rounded-full transition">
                <IconCompare />
              </button>
              <button onClick={() => { setActiveTab("favourites"); setSelectedProduct(null); }} className="p-2 text-slate-500 hover:text-rose-500 hover:bg-slate-100 rounded-full transition relative">
                <IconHeart filled={favourites.length > 0} />
                {favourites.length > 0 && <span className="absolute top-1 right-1 w-2 h-2 rounded-full bg-rose-500"></span>}
              </button>
            </div>
          </header>

          {/* MAIN VIEW */}
          <main className="flex-1 pb-24">
            {selectedProduct ? (
              <ProductDetailsView 
                product={selectedProduct} 
                onBack={() => setSelectedProduct(null)} 
                isFav={isFav(selectedProduct)}
                onToggleFav={() => toggleFavourite(selectedProduct)}
                portionMode={portionMode}
                setPortionMode={setPortionMode}
                onCompare={() => startComparison(selectedProduct)}
              />
            ) : (
              <>
                {activeTab === "home" && (
                  <HomeView 
                    searchQuery={searchQuery}
                    setSearchQuery={setSearchQuery}
                    onSearch={performSearch}
                    isSearching={isSearching}
                    searchResults={searchResults}
                    searchError={searchError}
                    onSelectProduct={handleSelectProduct}
                    recentScans={recentScans}
                    onOpenScan={() => setActiveTab("scan")}
                    onStartCompare={(prod) => startComparison(prod)}
                    onConnectUSDA={connectUSDA}
                    usdaKeyReady={usdaKeyReady}
                  />
                )}

                {activeTab === "scan" && (
                  <ScanCameraView 
                    onBarcodeFound={searchByBarcode}
                    onClose={() => setActiveTab("home")}
                  />
                )}

                {activeTab === "compare" && (
                  <CompareView 
                    itemA={compareItemA || MASTER_FOOD_DB[0]}
                    itemB={compareItemB || MASTER_FOOD_DB[MASTER_FOOD_DB.length - 1]}
                    allProducts={MASTER_FOOD_DB}
                    setCompareItemA={setCompareItemA}
                    setCompareItemB={setCompareItemB}
                  />
                )}

                {activeTab === "favourites" && (
                  <FavouritesView 
                    favourites={favourites}
                    onSelectProduct={handleSelectProduct}
                    onClearFavs={() => setFavourites([])}
                  />
                )}
              </>
            )}
          </main>

          {/* BOTTOM NAVIGATION */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur-md border-t border-slate-200 px-4 py-2 z-40 flex items-center justify-around">
            <button onClick={() => { setSelectedProduct(null); setActiveTab("home"); }} className={`flex flex-col items-center py-1 px-3 text-xs font-medium transition ${activeTab === "home" && !selectedProduct ? "text-brand-600 font-bold" : "text-slate-400 hover:text-slate-600"}`}>
              <IconHome />
              <span className="mt-1">Home</span>
            </button>

            <div className="relative -top-3">
              <button onClick={() => { setSelectedProduct(null); setActiveTab("scan"); }} className="w-14 h-14 rounded-full bg-gradient-to-tr from-brand-600 to-emerald-400 text-white flex items-center justify-center shadow-lg shadow-emerald-200 active:scale-95 transition transform hover:scale-105">
                <div className="absolute inset-0 rounded-full border-2 border-emerald-400 scan-ring pointer-events-none"></div>
                <IconScan className="w-7 h-7 text-white" />
              </button>
            </div>

            <button onClick={() => { setSelectedProduct(null); setActiveTab("compare"); }} className={`flex flex-col items-center py-1 px-3 text-xs font-medium transition ${activeTab === "compare" ? "text-brand-600 font-bold" : "text-slate-400 hover:text-slate-600"}`}>
              <IconCompare />
              <span className="mt-1">Compare</span>
            </button>

            <button onClick={() => { setSelectedProduct(null); setActiveTab("favourites"); }} className={`flex flex-col items-center py-1 px-3 text-xs font-medium transition ${activeTab === "favourites" ? "text-brand-600 font-bold" : "text-slate-400 hover:text-slate-600"}`}>
              <IconHeart filled={activeTab === "favourites"} />
              <span className="mt-1">Saved</span>
            </button>
          </nav>

        </div>
      );
    }

    // ==========================================
    // VIEW: HOME
    // ==========================================
    function HomeView({
      searchQuery,
      setSearchQuery,
      onSearch,
      isSearching,
      searchResults,
      searchError,
      onSelectProduct,
      recentScans,
      onOpenScan,
      onStartCompare,
      onConnectUSDA,
      usdaKeyReady
    }) {
      const popularChips = [
        "monster", "sting", "coca cola", "pepsi", "lays", "maggi", "oreo", "nutella"
      ];

      return (
        <div className="px-5 pt-4 space-y-6">
          
          {/* BANNER */}
          <div className="bg-gradient-to-br from-slate-900 to-slate-800 rounded-3xl p-5 text-white shadow-md relative overflow-hidden">
            <div className="relative z-10 space-y-2">
              <span className="text-[10px] font-extrabold uppercase tracking-widest text-emerald-400 bg-emerald-950/80 px-2.5 py-1 rounded-full border border-emerald-800">
                Food Safety Database
              </span>
              <h2 className="text-xl font-black text-white tracking-tight leading-snug">
                Search any packaged food <br />
                <span className="text-red-400 underline decoration-red-500">before you eat or buy</span>
              </h2>
              <p className="text-xs text-slate-300 leading-relaxed max-w-[280px]">
                Search foods and drinks across available product records. Nutrition and images appear only when a source provides them.
              </p>
            </div>
            <div className="absolute -right-4 -bottom-4 w-28 h-28 bg-emerald-500/10 rounded-full blur-2xl"></div>
          </div>

          {/* CRITICAL SEARCH BAR */}
          <div className="space-y-2">
            <form onSubmit={(e) => { e.preventDefault(); if (searchQuery.trim()) onSearch(searchQuery); }} className="relative flex items-center">
              <div className="absolute left-4 pointer-events-none">
                <IconSearch />
              </div>
              <input 
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search any food or drink before you buy it..."
                className="w-full bg-white text-slate-800 text-sm font-medium pl-11 pr-24 py-3.5 rounded-2xl border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition placeholder:text-slate-400"
              />
              <button 
                type="submit" 
                disabled={isSearching}
                className="absolute right-2 px-3.5 py-2 bg-brand-600 hover:bg-brand-700 active:scale-95 text-white text-xs font-bold rounded-xl transition disabled:opacity-50"
              >
                {isSearching ? "Searching..." : "Search"}
              </button>
            </form>

            <div className="flex items-center space-x-1.5 overflow-x-auto hide-scrollbar py-1 text-xs">

                <NutrientBar name="Salt / Sodium" val={saltVal} unit="g" max={3} warn={saltVal > 1.5} />
                <NutrientBar name="Dietary Fiber" val={fiberVal} unit="g" max={10} isPositive={true} />
                <NutrientBar name="Protein" val={proteinVal} unit="g" max={25} isPositive={true} />
              </div>

              <span className="font-bold text-slate-700">Notice:</span> Qyvarnex ratings (0–100) are generated via published WHO/FSA thresholds and detected synthetic chemicals. This tool provides nutritional education, not medical diagnosis.
            </div>

          </div>

    function NutrientBar({ name, val, unit, max, warn = false, isPositive = false }) {
      const v = val !== null && val !== undefined ? Number(val) : null;
      const pct = v !== null ? Math.min(100, Math.round((v / max) * 100)) : 0;
      let barColor = warn ? "bg-red-500" : isPositive ? "bg-emerald-500" : "bg-amber-400";

      return (
        <div className="space-y-1">
          <div className="flex justify-between text-xs">
            <span className="font-bold text-slate-700">{name}</span>
            <span className={`font-black ${warn ? "text-red-600" : "text-slate-800"}`}>
              {v !== null ? `${v} ${unit}` : "N/A"}
            </span>
          </div>
          <div className="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
            <div style={{ width: `${pct}%` }} className={`h-full rounded-full transition-all duration-500 ${barColor}`}></div>
          </div>
        </div>
      );
    }

    function ScanCameraView({ onBarcodeFound, onClose }) {

      const [manualBarcode, setManualBarcode] = useState("");
      const [scanStatus, setScanStatus] = useState("Starting camera…");
      const handledRef = useRef(false);

      useEffect(() => {
        let stream = null;
        let frameId = null;
        let stopped = false;
        let detector = null;

        async function startCamera() {
          try {
            if (!navigator.mediaDevices?.getUserMedia) {
              setCameraError("Camera access requires a supported browser and a secure context (HTTPS or localhost). Enter the barcode manually below.");
              return;
            }
            stream = await navigator.mediaDevices.getUserMedia({
              audio: false,
              video: { facingMode: { ideal: "environment" } }
            });
            if (stopped) {
              stream.getTracks().forEach(track => track.stop());
              return;
            }
            if (videoRef.current) {
              videoRef.current.srcObject = stream;
              await videoRef.current.play().catch(() => {});
            }

            if (!("BarcodeDetector" in window)) {
              setScanStatus("Live barcode detection is not supported in this browser. Enter the barcode manually below.");
              return;
            }

            try {
              const formats = await window.BarcodeDetector.getSupportedFormats();
              const preferred = ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "itf", "qr_code"];
              detector = new window.BarcodeDetector({ formats: preferred.filter(f => formats.includes(f)) });
            } catch {
              detector = new window.BarcodeDetector();
            }
            setScanStatus("Point the camera steadily at the barcode.");

            const scanFrame = async () => {
              if (stopped || handledRef.current || !videoRef.current || videoRef.current.readyState < 2) {
                if (!stopped && !handledRef.current) frameId = requestAnimationFrame(scanFrame);
                return;
              }
              try {
                const codes = await detector.detect(videoRef.current);
                const value = codes?.find(c => c.rawValue)?.rawValue;
                if (value) {
                  handledRef.current = true;
                  setScanStatus(`Barcode detected: ${value}`);
                  onBarcodeFound(value);
                  return;
                }
              } catch {
                // Keep scanning; some frames may not be decodable.
              }
              if (!stopped && !handledRef.current) frameId = requestAnimationFrame(scanFrame);
            };
            frameId = requestAnimationFrame(scanFrame);
          } catch (err) {
            setCameraError(err?.name === "NotAllowedError"
              ? "Camera permission was denied. Allow camera access or enter the barcode manually below."
              : "Could not start the camera. Use manual barcode entry below.");
          }
        }

        startCamera();
        return () => {
          stopped = true;
          if (frameId) cancelAnimationFrame(frameId);
          if (stream) stream.getTracks().forEach(track => track.stop());
        };
      }, []);

      const submitBarcode = (value) => {
        const clean = String(value || "").trim();
        if (!clean) return;
        handledRef.current = true;
        onBarcodeFound(clean);
      };

      return (
        <div className="fixed inset-0 bg-black z-50 flex flex-col justify-between max-w-md mx-auto text-white">
          <div className="p-4 flex items-center justify-between z-10 bg-gradient-to-b from-black/80 to-transparent">
            <button onClick={onClose} className="p-2 bg-white/20 rounded-full text-white" aria-label="Close scanner">✕</button>
            <span className="text-sm font-bold tracking-wider uppercase text-emerald-400">Barcode Scanner</span>
            <div className="w-8"></div>
          </div>

          <div className="flex-1 relative overflow-hidden flex items-center justify-center">
            <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none p-6">
              <div className="w-72 h-48 border-2 border-emerald-400 rounded-3xl relative overflow-hidden shadow-[0_0_0_9999px_rgba(0,0,0,0.5)]">
                <div className="w-full h-0.5 bg-red-500 shadow-[0_0_8px_#ef4444] animate-bounce"></div>
              </div>
            </div>
            <div className="absolute bottom-4 left-4 right-4 bg-black/70 rounded-xl p-3 text-center text-xs">{cameraError || scanStatus}</div>
          </div>

          <div className="p-4 bg-slate-900/95 border-t border-slate-800 space-y-3 z-10">
            <p className="text-[11px] text-slate-400">If automatic scanning is unavailable, enter the numbers printed below the barcode.</p>
            <form onSubmit={(e) => { e.preventDefault(); submitBarcode(manualBarcode); }} className="flex space-x-2">
              <input
                type="text"
                inputMode="numeric"
                autoComplete="off"
                value={manualBarcode}
                onChange={(e) => setManualBarcode(e.target.value)}
                placeholder="Enter barcode manually…"
                aria-label="Barcode number"
                className="flex-1 bg-slate-800 text-white text-xs px-3.5 py-2.5 rounded-xl border border-slate-700 focus:outline-none"
              />
              <button type="submit" className="bg-brand-600 text-white text-xs font-bold px-4 py-2.5 rounded-xl">Lookup</button>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // VIEW: COMPARISON
    // ==========================================
    function CompareView({ itemA, itemB, allProducts, setCompareItemA, setCompareItemB }) {
      const scoreA = calculateHealthScore(itemA);
      const scoreB = calculateHealthScore(itemB);
      const dangersA = detectHarmfulIngredients(itemA?.ingredients_text, itemA?.nutriments);
      const dangersB = detectHarmfulIngredients(itemB?.ingredients_text, itemB?.nutriments);

      return (
        <div className="p-5 space-y-5">
          <div>
            <span className="text-[10px] uppercase font-bold tracking-wider text-brand-600">Head to Head</span>
            <h2 className="text-xl font-black text-slate-900 tracking-tight">Nutrition & Toxicity Duel</h2>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div className="bg-white p-3 rounded-2xl border border-slate-200 space-y-2 text-center">
              <select 
                value={itemA?.id} 
                onChange={(e) => setCompareItemA(allProducts.find(p => p.id === e.target.value))}
                className="w-full text-xs font-bold bg-slate-50 p-2 rounded-xl border"
              >
                {allProducts.map(p => <option key={p.id} value={p.id}>{p.product_name}</option>)}
              </select>
              <div className="h-20 bg-slate-50 rounded-xl flex items-center justify-center p-1 overflow-hidden">
                <img src={itemA?.image_url} alt="" className="h-full object-contain" />
              </div>
              <div className="bg-red-50 p-2 rounded-xl border border-red-200">
                <span className="text-lg font-black text-red-600">{scoreA}/100</span>
                <span className="text-[9px] font-bold text-red-700 block">{dangersA.length} Dangerous Item(s)</span>
              </div>
            </div>

            <div className="bg-white p-3 rounded-2xl border border-slate-200 space-y-2 text-center">
              <select 
                value={itemB?.id} 
                onChange={(e) => setCompareItemB(allProducts.find(p => p.id === e.target.value))}
                className="w-full text-xs font-bold bg-slate-50 p-2 rounded-xl border"
              >
                {allProducts.map(p => <option key={p.id} value={p.id}>{p.product_name}</option>)}
              </select>
              <div className="h-20 bg-slate-50 rounded-xl flex items-center justify-center p-1 overflow-hidden">
                <img src={itemB?.image_url} alt="" className="h-full object-contain" />
              </div>
              <div className="bg-emerald-50 p-2 rounded-xl border border-emerald-200">
                <span className="text-lg font-black text-emerald-600">{scoreB}/100</span>
                <span className="text-[9px] font-bold text-emerald-700 block">{dangersB.length} Dangerous Item(s)</span>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-4 border border-slate-200 shadow-2xs space-y-3">
            <h3 className="text-xs font-black uppercase tracking-wider text-slate-700">Additives Breakdown</h3>
            <div className="grid grid-cols-2 gap-3 text-xs">
              <div className="p-3 bg-red-50/50 rounded-2xl border border-red-100">
                <span className="text-[10px] font-bold text-red-700 block uppercase">Product A:</span>
                {dangersA.length > 0 ? (
                  <ul className="mt-1 space-y-1">
                    {dangersA.map((d, i) => <li key={i} className="text-[10px] font-bold text-red-900">• {d.name}</li>)}
                  </ul>
                ) : <span className="text-[11px] text-emerald-600 font-bold">None detected</span>}
              </div>

              <div className="p-3 bg-emerald-50/50 rounded-2xl border border-emerald-100">
                <span className="text-[10px] font-bold text-emerald-700 block uppercase">Product B:</span>
                {dangersB.length > 0 ? (
                  <ul className="mt-1 space-y-1">
                    {dangersB.map((d, i) => <li key={i} className="text-[10px] font-bold text-red-900">• {d.name}</li>)}
                  </ul>
                ) : <span className="text-[11px] text-emerald-600 font-bold">None detected</span>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // VIEW: SAVED FAVOURITES
    // ==========================================
    function FavouritesView({ favourites, onSelectProduct, onClearFavs }) {
      return (
        <div className="p-5 space-y-5">
          <div className="flex items-center justify-between">
            <div>
              <span className="text-[10px] uppercase font-bold tracking-wider text-brand-600">Saved Items</span>
              <h2 className="text-xl font-black text-slate-900 tracking-tight">Your Favourites</h2>
            </div>
            {favourites.length > 0 && (
              <button onClick={onClearFavs} className="text-xs font-bold text-red-600 hover:underline">Clear all</button>
            )}
          </div>

          {favourites.length === 0 ? (
            <div className="py-16 text-center space-y-3 bg-white rounded-3xl border border-slate-200 p-6">
              <div className="w-12 h-12 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto">
                <IconHeart />
              </div>
              <h3 className="text-sm font-bold text-slate-800">No saved foods yet</h3>
              <p className="text-xs text-slate-400 max-w-xs mx-auto">Tap the heart icon on any food page to save it for grocery visits.</p>
            </div>
          ) : (
            <div className="space-y-3">
              {favourites.map((item, idx) => {
                const score = calculateHealthScore(item);
                const badge = getScoreBadge(score);

                return (
                  <div 
                    key={item.id || idx}
                    onClick={() => onSelectProduct(item)}
                    className="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-2xs hover:border-brand-500 transition cursor-pointer flex items-center space-x-3"
                  >
                    <div className="w-14 h-14 bg-slate-50 rounded-xl p-1 flex items-center justify-center flex-shrink-0 border border-slate-100 overflow-hidden">
                      <img src={item.image_url} alt={item.product_name} className="w-full h-full object-contain" />
                    </div>
                    <div className="flex-1 min-w-0">
                      <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 truncate block">{item.brands}</span>
                      <h4 className="text-sm font-bold text-slate-900 truncate">{item.product_name}</h4>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full inline-block mt-1 ${badge.lightBg} ${badge.textCol}`}>
                        Score: {score}/100
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
